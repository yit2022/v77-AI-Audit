# V77 AI Auditor — Contabo production stack (app + Postgres + Caddy)
# Copy .env.example → .env, fill secrets from deploy-secrets.txt, then:
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-v77}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-v77}
    volumes:
      - v77_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-v77} -d ${POSTGRES_DB:-v77}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      V77_DATA_DIR: /data
      DATABASE_URL: postgres://${POSTGRES_USER:-v77}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-v77}
      DISABLE_DEMO_PASSWORDS: "true"
      AI_PROVIDER: mock
      # Do not set OPENAI_API_KEY / ANTHROPIC_API_KEY — mock only
    volumes:
      - v77_data:/data
      - v77_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:

volumes:
  v77_pg:
  v77_data:
  v77_uploads:
  caddy_data:
  caddy_config:
